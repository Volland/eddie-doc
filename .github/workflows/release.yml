name: Release

# Push a tag like v1.4.0 (./release.sh does this). One run builds both products:
#  - release "v1.4.0": the VS Code .vsix, with the Obsidian files attached too
#  - release "1.4.0":  the three Obsidian plugin files only
# Obsidian (and BRAT) look a plugin release up by a tag equal to manifest.json's
# version, with no "v", so the second release is what Obsidian installs from.
# A tag containing "-" (v1.4.0-beta.1) is published as a pre-release.
#
# This workflow is the only thing that publishes release files. Each file is attested
# (GitHub artifact attestation, SLSA provenance) before it is uploaded, so anyone can
# check that a downloaded main.js was built from this repository by this workflow:
#   gh attestation verify main.js --repo Volland/eddie-doc

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # lets the attest step obtain a signing identity for this run
  attestations: write  # lets it record the attestation against this repository

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tag, package.json and manifest.json agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          man="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$man" ]; then
            echo "tag=$tag package.json=$pkg manifest.json=$man — they must be equal" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT" ;; *) echo "pre=false" >> "$GITHUB_OUTPUT" ;; esac

      - run: npm run check:core
      - run: npm test
      - run: npm run build
      - run: npm run verify:cli
      - run: npm run verify:obsidian-engine
      - run: npm run smoke:obsidian

      - name: Package the VS Code extension
        run: npx --yes @vscode/vsce package --skip-license -o "eddie-doc-${{ steps.version.outputs.version }}.vsix"

      # Attest the exact bytes that are uploaded below; the release steps read the same paths.
      - name: Attest the release files
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/obsidian/main.js
            dist/obsidian/manifest.json
            dist/obsidian/styles.css
            eddie-doc-${{ steps.version.outputs.version }}.vsix

      - name: Release v${{ steps.version.outputs.version }} (VS Code + all files)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Eddie Doc ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.pre }}
          files: |
            eddie-doc-${{ steps.version.outputs.version }}.vsix
            dist/obsidian/main.js
            dist/obsidian/manifest.json
            dist/obsidian/styles.css

      - name: Release ${{ steps.version.outputs.version }} (Obsidian plugin files)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Eddie Doc ${{ steps.version.outputs.version }} (Obsidian plugin)
          body: |
            Obsidian plugin files for Eddie Doc ${{ steps.version.outputs.version }}: `main.js`, `manifest.json`, `styles.css`.
            Install with BRAT (`Volland/eddie-doc`) or copy the three files into `<vault>/.obsidian/plugins/eddie-doc/`.
            See [docs/OBSIDIAN.md](https://github.com/Volland/eddie-doc/blob/main/docs/OBSIDIAN.md). The VS Code extension is on release `v${{ steps.version.outputs.version }}`.
          prerelease: ${{ steps.version.outputs.pre }}
          files: |
            dist/obsidian/main.js
            dist/obsidian/manifest.json
            dist/obsidian/styles.css
